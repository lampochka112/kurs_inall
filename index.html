<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebCourse Pro — HTML · CSS · JS</title>
<style>
/* ============ RESET & TOKENS ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1120;
  --bg-soft:#111a2e;
  --bg-card:#151f36;
  --text:#e2e8f0;
  --muted:#94a3b8;
  --border:#243049;
  --html:#f97316;
  --css:#3b82f6;
  --js:#eab308;
  --accent:#38bdf8;
  --accent2:#a855f7;
  --green:#22c55e;
  --radius:14px;
  --shadow:0 20px 40px rgba(0,0,0,.35);
  --mono:'Fira Code','Consolas',monospace;
}
body.light{
  --bg:#f6f8fc;
  --bg-soft:#ffffff;
  --bg-card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --shadow:0 20px 40px rgba(15,23,42,.08);
}
html{scroll-behavior:smooth}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{
  font-family:var(--mono);
  background:var(--bg-soft);
  padding:2px 6px;
  border-radius:5px;
  font-size:.88em;
  color:var(--accent);
}
pre{
  background:#080d1a;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  overflow-x:auto;
  margin:14px 0 20px;
  font-size:.86rem;
  line-height:1.65;
}
pre code{background:none;padding:0;color:#e2e8f0;font-size:inherit}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}

/* ============ SIDEBAR ============ */
.sidebar{
  width:300px;
  flex-shrink:0;
  background:var(--bg-soft);
  border-right:1px solid var(--border);
  height:100vh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  transition:transform .3s ease;
  z-index:200;
}
.brand{
  padding:22px 22px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--border);
}
.brand__logo{
  width:42px;height:42px;
  display:grid;place-items:center;
  border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-weight:700;font-family:var(--mono);font-size:.95rem;
}
.brand__title{font-size:1.1rem;font-weight:700}
.brand__sub{font-size:.72rem;color:var(--muted)}

.sidebar__scroll{
  overflow-y:auto;
  flex:1;
  padding:16px 14px 24px;
}
.sidebar__scroll::-webkit-scrollbar{width:6px}
.sidebar__scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.cat{margin-bottom:20px}
.cat__head{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  font-size:.72rem;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);
}
.cat__dot{width:9px;height:9px;border-radius:50%}
.cat--html .cat__dot{background:var(--html)}
.cat--css .cat__dot{background:var(--css)}
.cat--js .cat__dot{background:var(--js)}
.cat--proj .cat__dot{background:var(--green)}
.cat--ref .cat__dot{background:var(--accent2)}

.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;
  border-radius:9px;
  font-size:.88rem;
  color:var(--muted);
  cursor:pointer;
  transition:.2s;
  border:none;background:none;width:100%;text-align:left;
  font-family:inherit;
  line-height:1.3;
}
.nav-item:hover{background:var(--bg-card);color:var(--text)}
.nav-item.active{
  background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(168,85,247,.15));
  color:var(--text);
  font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent);
}
.nav-item .num{opacity:.5;font-family:var(--mono);font-size:.75rem;flex-shrink:0;width:20px}
.nav-item .lbl{flex:1;min-width:0}
.nav-item .done-ic{color:var(--green);font-size:.8rem}

/* Progress */
.progress-box{
  padding:16px 22px 20px;
  border-top:1px solid var(--border);
  font-size:.8rem;
  color:var(--muted);
}
.progress-bar{
  height:8px;background:var(--bg-card);border-radius:999px;
  overflow:hidden;margin:8px 0;
}
.progress-bar__fill{
  height:100%;width:0;
  background:linear-gradient(90deg,var(--html),var(--css),var(--js));
  transition:width .4s;
}
.progress-text{display:flex;justify-content:space-between}

/* ============ MAIN ============ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.topbar{
  position:sticky;top:0;z-index:90;
  display:flex;align-items:center;gap:14px;
  padding:14px 28px;
  background:rgba(11,17,32,.8);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
body.light .topbar{background:rgba(246,248,252,.85)}

.burger-btn{
  display:none;
  width:40px;height:40px;border-radius:10px;
  background:var(--bg-card);border:1px solid var(--border);
  cursor:pointer;color:var(--text);font-size:1.2rem;
}
.breadcrumb{font-size:.85rem;color:var(--muted);flex:1;min-width:0}
.breadcrumb b{color:var(--text)}

.topbar__actions{display:flex;gap:8px;align-items:center}

.search-btn,.theme-btn{
  width:40px;height:40px;border-radius:50%;
  background:var(--bg-card);border:1px solid var(--border);
  cursor:pointer;font-size:1.05rem;color:var(--text);
  transition:.2s;
  display:grid;place-items:center;
}
.search-btn:hover,.theme-btn:hover{transform:rotate(20deg);border-color:var(--accent)}

.content{
  max-width:920px;
  width:100%;
  margin:0 auto;
  padding:42px 28px 80px;
}

/* ============ HERO ============ */
.welcome{text-align:center;padding:30px 0 20px}
.welcome__badge{
  display:inline-block;
  padding:6px 16px;
  border-radius:999px;
  background:rgba(56,189,248,.1);
  border:1px solid rgba(56,189,248,.35);
  color:var(--accent);
  font-size:.8rem;
  margin-bottom:20px;
}
.welcome h1{
  font-size:clamp(1.8rem,4vw,2.8rem);
  line-height:1.2;
  margin-bottom:16px;
}
.gradient-text{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome p{color:var(--muted);max-width:600px;margin:0 auto 32px;font-size:1.05rem}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;
  margin:32px 0;
}
.stat{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  text-align:center;
}
.stat strong{display:block;font-size:1.8rem;color:var(--accent)}
.stat span{font-size:.82rem;color:var(--muted)}

.cat-cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;
  margin-top:36px;
}
.cat-card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  cursor:pointer;
  text-align:left;
  transition:.25s;
  font-family:inherit;
  color:var(--text);
}
.cat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.cat-card__icon{font-size:2rem;margin-bottom:12px}
.cat-card__title{font-size:1.1rem;margin-bottom:6px;font-weight:700}
.cat-card__desc{font-size:.85rem;color:var(--muted)}
.cat-card--html:hover{border-color:var(--html)}
.cat-card--css:hover{border-color:var(--css)}
.cat-card--js:hover{border-color:var(--js)}
.cat-card--ref:hover{border-color:var(--accent2)}

/* ============ LESSON ============ */
.lesson{display:none}
.lesson.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.lesson__tag{
  display:inline-block;
  padding:4px 14px;
  border-radius:999px;
  font-size:.72rem;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:14px;
}
.tag--html{background:rgba(249,115,22,.15);color:var(--html)}
.tag--css{background:rgba(59,130,246,.15);color:var(--css)}
.tag--js{background:rgba(234,179,8,.15);color:var(--js)}
.tag--proj{background:rgba(34,197,94,.15);color:var(--green)}
.tag--ref{background:rgba(168,85,247,.15);color:var(--accent2)}

.lesson h1{font-size:clamp(1.6rem,3.5vw,2.3rem);line-height:1.2;margin-bottom:14px}
.lesson__lead{color:var(--muted);font-size:1.05rem;margin-bottom:22px}
.lesson__meta{
  display:flex;gap:18px;flex-wrap:wrap;
  font-size:.83rem;color:var(--muted);
  padding-bottom:22px;margin-bottom:28px;
  border-bottom:1px solid var(--border);
}

/* Level tabs */
.level-tabs{
  display:flex;gap:8px;
  background:var(--bg-card);
  padding:6px;
  border-radius:12px;
  margin:0 0 28px;
  border:1px solid var(--border);
  width:fit-content;
  max-width:100%;
  flex-wrap:wrap;
}
.level-tab{
  padding:10px 20px;
  border-radius:9px;
  background:transparent;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-weight:600;
  font-size:.9rem;
  font-family:inherit;
  transition:.2s;
  display:flex;
  align-items:center;
  gap:6px;
}
.level-tab:hover{color:var(--text)}
.level-tab.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
}
.level-tab .badge{
  padding:1px 7px;
  border-radius:999px;
  background:rgba(255,255,255,.2);
  font-size:.7rem;
  font-weight:700;
}
.level-tab.active .badge{background:rgba(255,255,255,.3)}

.level-content{display:none}
.level-content.active{display:block;animation:fade .3s ease}

.lesson h2{
  font-size:1.35rem;
  margin:36px 0 14px;
  padding-top:10px;
  color:var(--text);
  scroll-margin-top:80px;
}
.lesson h2::before{
  content:'#';
  color:var(--accent);
  margin-right:10px;
  font-family:var(--mono);
  opacity:.6;
}
.lesson h3{font-size:1.08rem;margin:22px 0 8px;color:var(--accent)}
.lesson h4{font-size:.98rem;margin:18px 0 6px;color:var(--text);opacity:.9}
.lesson p{margin-bottom:14px;color:var(--text)}
.lesson ul,.lesson ol{margin:10px 0 18px 22px;color:var(--text)}
.lesson li{margin-bottom:6px}
.lesson strong{color:var(--text)}
.lesson hr{border:none;border-top:1px solid var(--border);margin:28px 0}

.note{
  background:rgba(56,189,248,.08);
  border-left:3px solid var(--accent);
  padding:14px 18px;
  border-radius:8px;
  margin:16px 0;
  font-size:.92rem;
  color:var(--text);
}
.note--warn{
  background:rgba(234,179,8,.08);
  border-left-color:var(--js);
}
.note--tip{
  background:rgba(34,197,94,.08);
  border-left-color:var(--green);
}
.note--pro{
  background:rgba(168,85,247,.08);
  border-left-color:var(--accent2);
}

.table{
  width:100%;
  border-collapse:collapse;
  margin:16px 0 22px;
  background:var(--bg-card);
  border-radius:10px;
  overflow:hidden;
  font-size:.9rem;
}
.table th,.table td{
  padding:10px 14px;
  border-bottom:1px solid var(--border);
  text-align:left;
}
.table th{background:var(--bg-soft);font-weight:600;color:var(--accent)}
.table tr:last-child td{border-bottom:none}

/* Anchor list */
.anchors{
  display:flex;flex-wrap:wrap;gap:6px;
  margin:0 0 28px;
  padding:14px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:12px;
}
.anchors a{
  padding:5px 12px;
  border-radius:999px;
  background:var(--bg-soft);
  font-size:.82rem;
  color:var(--muted);
  transition:.2s;
}
.anchors a:hover{
  color:var(--accent);
  background:var(--bg);
  text-decoration:none;
}

.lesson__nav{
  display:flex;justify-content:space-between;gap:12px;
  margin-top:50px;padding-top:28px;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
  align-items:center;
}
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:11px 20px;border-radius:10px;
  font-weight:600;font-size:.92rem;
  cursor:pointer;border:none;font-family:inherit;
  transition:.25s;text-decoration:none;
}
.btn--primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn--primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(56,189,248,.35);text-decoration:none}
.btn--ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn--ghost:hover{border-color:var(--accent);text-decoration:none}
.btn--done{background:var(--green);color:#06210f}
.btn:disabled{opacity:.55;cursor:default;transform:none!important;box-shadow:none!important}

/* Projects */
.projects-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
  margin:20px 0;
}
.project{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  transition:.25s;
}
.project:hover{border-color:var(--green);transform:translateY(-4px)}
.project__icon{font-size:2rem;margin-bottom:10px}
.project h3{margin-bottom:8px;color:var(--text)}
.project p{font-size:.88rem;color:var(--muted);margin-bottom:14px}
.project__tags{display:flex;gap:6px;flex-wrap:wrap;list-style:none;margin:0 0 14px}
.project__tags li{
  padding:2px 10px;border-radius:999px;
  background:var(--bg-soft);font-size:.72rem;color:var(--muted);
}

/* ============ SEARCH MODAL ============ */
.search-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:500;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(4px);
  padding:80px 20px 40px;
  overflow-y:auto;
}
.search-modal.show{display:block}
.search-box{
  max-width:600px;
  margin:0 auto;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
}
.search-box input{
  width:100%;
  padding:14px 18px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text);
  font-size:1rem;
  font-family:inherit;
  outline:none;
}
.search-box input:focus{border-color:var(--accent)}
.search-results{
  margin-top:14px;
  max-height:50vh;
  overflow-y:auto;
}
.search-result{
  padding:12px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.15s;
}
.search-result:hover{background:var(--bg-card)}
.search-result__title{font-weight:600;margin-bottom:2px;color:var(--text)}
.search-result__cat{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.search-empty{color:var(--muted);text-align:center;padding:20px}

/* Overlay */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.5);z-index:150;
}
.overlay.show{display:block}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  .sidebar{
    position:fixed;left:0;top:0;
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .burger-btn{display:grid;place-items:center}
  .content{padding:28px 18px 60px}
  .topbar{padding:12px 18px}
  .level-tabs{width:100%}
  .level-tab{flex:1;justify-content:center}
}
@media(max-width:520px){
  .lesson__meta{font-size:.78rem;gap:10px}
  pre{font-size:.76rem;padding:14px}
  .lesson__nav .btn{flex:1;justify-content:center;font-size:.85rem}
  .anchors{padding:10px}
}
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand__logo">{ }</div>
      <div>
        <div class="brand__title">WebCourse Pro</div>
        <div class="brand__sub">HTML · CSS · JS · Проекты</div>
      </div>
    </div>

    <div class="sidebar__scroll" id="sidebarNav"></div>

    <div class="progress-box">
      <div class="progress-text">
        <span>Прогресс</span>
        <span id="progressLabel">0 / 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-bar__fill" id="progressFill"></div>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <button class="burger-btn" id="burgerBtn" aria-label="Меню">☰</button>
      <div class="breadcrumb" id="breadcrumb"><b>Главная</b></div>
      <div class="topbar__actions">
        <button class="search-btn" id="searchBtn" aria-label="Поиск">🔍</button>
        <button class="theme-btn" id="themeBtn" aria-label="Тема">🌙</button>
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- SEARCH MODAL -->
<div class="search-modal" id="searchModal">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск по курсу..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<script>
/* ==========================================================
   ДАННЫЕ КУРСА
   Каждый модуль содержит:
   - levels: { basic: HTML, advanced: HTML }
   - anchors: якорные ссылки для навигации
   ========================================================== */
const COURSE = {
  welcome: {
    id: 'welcome',
    title: 'Главная',
    html: `
      <div class="welcome">
        <span class="welcome__badge">Бесплатно · Для новичков и среднего уровня</span>
        <h1>HTML + CSS + <span class="gradient-text">JavaScript</span><br>от новичка до уверенного джуна</h1>
        <p>Полный практический курс: два уровня на каждый модуль, ~100 часов, 3 проекта в портфолио. Учись в своём темпе.</p>

        <div class="stats">
          <div class="stat"><strong>12</strong><span>модулей</span></div>
          <div class="stat"><strong>100+</strong><span>часов</span></div>
          <div class="stat"><strong>2</strong><span>уровня</span></div>
          <div class="stat"><strong>3</strong><span>проекта</span></div>
        </div>

        <div class="cat-cards">
          <button class="cat-card cat-card--html" data-go="html-basics">
            <div class="cat-card__icon">🟠</div>
            <div class="cat-card__title">HTML</div>
            <div class="cat-card__desc">3 модуля · структура, формы, семантика, a11y</div>
          </button>
          <button class="cat-card cat-card--css" data-go="css-basics">
            <div class="cat-card__icon">🔵</div>
            <div class="cat-card__title">CSS</div>
            <div class="cat-card__desc">4 модуля · стили, layout, адаптив, advanced</div>
          </button>
          <button class="cat-card cat-card--js" data-go="js-basics">
            <div class="cat-card__icon">🟡</div>
            <div class="cat-card__title">JavaScript</div>
            <div class="cat-card__desc">5 модулей · от переменных до async и ES6+</div>
          </button>
          <button class="cat-card cat-card--ref" data-go="cheatsheet">
            <div class="cat-card__icon">📖</div>
            <div class="cat-card__title">Шпаргалки</div>
            <div class="cat-card__desc">Краткий справочник по всем темам</div>
          </button>
        </div>

        <div class="anchors" style="margin-top:32px">
          <a href="#html-basics" data-go="html-basics">🟠 HTML с нуля</a>
          <a href="#css-basics" data-go="css-basics">🔵 CSS с нуля</a>
          <a href="#js-basics" data-go="js-basics">🟡 JS с нуля</a>
          <a href="#cheatsheet" data-go="cheatsheet">📖 Шпаргалки</a>
        </div>
      </div>
    `
  },

  /* ==================== HTML ==================== */
  'html-basics': {
    cat: 'html',
    num: '01',
    title: 'Основы HTML',
    lead: 'Структура документа, теги, ссылки, картинки, списки и таблицы — фундамент любого сайта.',
    meta: ['⏱ 4–5 часов', '✍️ 6 заданий', '🟠 HTML'],
    anchors: [
      { id: 'what', label: 'Что такое HTML' },
      { id: 'structure', label: 'Структура' },

        <h2>Что такое CSS</h2>
        <p><strong>CSS</strong> (Cascading Style Sheets) — язык стилей, описывающий внешний вид элементов.</p>

        <h2 id="connect">Способы подключения</h2>
        <pre><code>&lt;!-- Внешний файл (лучший способ) --&gt;
&lt;link rel="stylesheet" href="style.css"&gt;

&lt;!-- Внутренний --&gt;
&lt;style&gt; body { color: red; } &lt;/style&gt;

&lt;!-- Инлайновый (не рекомендуется) --&gt;
&lt;p style="color: red;"&gt;Текст&lt;/p&gt;</code></pre>

        <h2 id="selectors">Селекторы</h2>
        <pre><code>/* по тегу */
p { color: #333; }

/* по классу */
.card { padding: 16px; }

/* по id */
#title { font-size: 2rem; }

/* по атрибуту */
input[type="email"] { border-color: green; }

/* вложенный */
.card p { color: gray; }

/* дочерний */
.menu > li { padding: 4px; }

/* соседний */
h2 + p { margin-top: 0; }

/* псевдокласс */
button:hover { background: blue; }
li:nth-child(2n) { background: #eee; }
input:focus { outline: 2px solid blue; }

/* псевдоэлемент */
.card::before { content: "★ "; }
.card::after { content: ""; }
p::first-line { font-weight: bold; }</code></pre>

        <h2 id="cascade">Каскад и специфичность</h2>
        <table class="table">
          <thead><tr><th>Селектор</th><th>Вес</th></tr></thead>

            <tr><td>!important</td><td>10000</td></tr>
            <tr><td>inline style</td><td>1000</td></tr>
            <tr><td>#id</td><td>100</td></tr>
            <tr><td>.class, :hover, [attr]</td><td>10</td></tr>
            <tr><td>тег</td><td>1</td></tr>
          </tbody>
        </table>
        <div class="note note--warn">⚠️ Не используй <code>!important</code> без крайней нужды — это код-смрад.</div>

        <h2 id="box">Box Model</h2>

        <ul>
          <li><b>Vite</b> — быстрая сборка</li>
          <li><b>ESLint + Prettier</b> — форматирование</li>
          <li><b>Lighthouse</b> — аудит</li>
          <li><b>Chrome DevTools</b> — Performance, Network</li>
        </ul>
      `
    }
  }
};

/* ==========================================================
   НАВИГАЦИЯ
   ========================================================== */
const NAV = [
  { cat: 'html', label: 'HTML', items: ['html-basics','html-forms','html-media-semantic'] },
  { cat: 'css',  label: 'CSS',  items: ['css-basics','css-layout','css-responsive','css-advanced'] },
  { cat: 'js',   label: 'JavaScript', items: ['js-basics','js-functions','js-dom','js-es6','js-async'] },
  { cat: 'proj', label: 'Проекты', items: ['projects'] },
  { cat: 'ref',  label: 'Справочник', items: ['cheatsheet'] },
];

/* ==========================================================
   STATE
   ========================================================== */
const state = {
  current: 'welcome',
  currentLevel: 'basic',   // запоминаем выбор уровня
  levelByModule: {},       // { id: 'basic' | 'advanced' }
  completed: JSON.parse(localStorage.getItem('completed-v2') || '[]'),
  theme: localStorage.getItem('theme') || 'dark',
};

const ALL_LESSONS = NAV.flatMap(g => g.items);
const content = document.getElementById('content');
const breadcrumb = document.getElementById('breadcrumb');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const sidebarNav = document.getElementById('sidebarNav');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const themeBtn = document.getElementById('themeBtn');
const burgerBtn = document.getElementById('burgerBtn');
const searchBtn = document.getElementById('searchBtn');
const searchModal = document.getElementById('searchModal');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

/* ==========================================================
   SIDEBAR
   ========================================================== */
function renderSidebar() {
  sidebarNav.innerHTML = NAV.map(group => `
    <div class="cat cat--${group.cat}">
      <div class="cat__head">
        <span class="cat__dot"></span>${group.label}
      </div>
      ${group.items.map(id => {
        const lesson = COURSE[id];
        if (!lesson) return '';
        const active = state.current === id ? 'active' : '';
        const done = state.completed.includes(id) ? '✓' : '';
        return `<button class="nav-item ${active}" data-go="${id}">
          <span class="num">${lesson.num}</span>
          <span class="lbl">${lesson.title}</span>
          ${done ? `<span class="done-ic">✓</span>` : ''}
        </button>`;
      }).join('')}
    </div>
  `).join('');
}

/* ==========================================================
   PROGRESS
   ========================================================== */
function updateProgress() {
  const total = ALL_LESSONS.length;
  const done = state.completed.filter(id => ALL_LESSONS.includes(id)).length;
  const pct = total ? (done / total) * 100 : 0;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = `${done} / ${total}`;
}

/* ==========================================================
   RENDER
   ========================================================== */
function render(id, opts = {}) {
  const lesson = COURSE[id];
  if (!lesson) return;

  state.current = id;
  location.hash = id;

  if (id === 'welcome') {
    breadcrumb.innerHTML = '<b>Главная</b>';
    content.innerHTML = lesson.html;
    window.scrollTo(0,0);
    return;
  }

  const tagLabel = { html:'HTML', css:'CSS', js:'JavaScript', proj:'Проект', ref:'Справочник' }[lesson.cat];
  const idx = ALL_LESSONS.indexOf(id);
  const prev = idx > 0 ? ALL_LESSONS[idx - 1] : null;
  const next = idx < ALL_LESSONS.length - 1 ? ALL_LESSONS[idx + 1] : null;

  // Текущий уровень
  const currentLevel = opts.level
    || state.levelByModule[id]
    || 'basic';
  state.levelByModule[id] = currentLevel;

  breadcrumb.innerHTML = `<b>${tagLabel}</b> / ${lesson.title}`;

  const anchorsHtml = lesson.anchors && lesson.anchors.length
    ? `<div class="anchors">
        ${lesson.anchors.map(a => `<a href="#${a.id}" data-anchor="${a.id}">${a.label}</a>`).join('')}
       </div>`
    : '';

  const hasAdvanced = lesson.levels.advanced && lesson.levels.advanced.trim().length > 0;

  content.innerHTML = `
    <div class="lesson active">
      <span class="lesson__tag tag--${lesson.cat}">${tagLabel}</span>
      <h1>${lesson.title}</h1>
      <p class="lesson__lead">${lesson.lead}</p>
      <div class="lesson__meta">${lesson.meta.map(m => `<span>${m}</span>`).join('')}</div>

      ${hasAdvanced ? `
        <div class="level-tabs">
          <button class="level-tab ${currentLevel === 'basic' ? 'active' : ''}" data-level="basic">
            🟢 Базовый <span class="badge">новичок</span>
          </button>
          <button class="level-tab ${currentLevel === 'advanced' ? 'active' : ''}" data-level="advanced">
            🔵 Продвинутый <span class="badge">средний</span>
          </button>
        </div>
      ` : ''}

      ${anchorsHtml}

      <div class="level-content ${currentLevel === 'basic' ? 'active' : ''}" data-content="basic">
        ${lesson.levels.basic}
      </div>
      ${hasAdvanced ? `
        <div class="level-content ${currentLevel === 'advanced' ? 'active' : ''}" data-content="advanced">
          ${lesson.levels.advanced}
        </div>
      ` : ''}

      <div class="lesson__nav">
        ${prev ? `<button class="btn btn--ghost" data-go="${prev}">← ${COURSE[prev].title}</button>` : '<span></span>'}
        <button class="btn ${isDone(id) ? 'btn--done' : 'btn--primary'}" id="doneBtn" ${isDone(id) ? 'disabled' : ''}>
          ${isDone(id) ? '✓ Пройдено' : 'Отметить как пройденный'}
        </button>
        ${next ? `<button class="btn btn--primary" data-go="${next}">${COURSE[next].title} →</button>` : '<span></span>'}
      </div>
    </div>
  `;

  window.scrollTo(0,0);

  // Уровни
  content.querySelectorAll('.level-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const level = tab.dataset.level;
      state.levelByModule[id] = level;
      content.querySelectorAll('.level-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      content.querySelectorAll('.level-content').forEach(c => {
        c.classList.toggle('active', c.dataset.content === level);
      });
    });
  });

  // Якоря
  content.querySelectorAll('[data-anchor]').forEach(a => {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.anchor);
      if (target) {
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  // Кнопка «пройдено»
  const doneBtn = document.getElementById('doneBtn');
  if (doneBtn && !isDone(id)) {
    doneBtn.addEventListener('click', () => markDone(id));
  }

  renderSidebar();
  closeSidebar();
}

function isDone(id) {
  return state.completed.includes(id);
}

function markDone(id) {
  if (!state.completed.includes(id)) {
    state.completed.push(id);
    localStorage.setItem('completed-v2', JSON.stringify(state.completed));
    updateProgress();
    render(id, { level: state.levelByModule[id] });
  }
}

/* ==========================================================
   GLOBAL DELEGATION
   ========================================================== */
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) {
    render(go.dataset.go);
    return;
  }
});

/* ==========================================================
   SIDEBAR TOGGLE
   ========================================================== */
burgerBtn.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});

function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}
overlay.addEventListener('click', closeSidebar);

/* ==========================================================
   THEME
   ========================================================== */
function applyTheme() {
  if (state.theme === 'light') {
    document.body.classList.add('light');
    themeBtn.textContent = '☀️';
  } else {
    document.body.classList.remove('light');
    themeBtn.textContent = '🌙';
  }
}
themeBtn.addEventListener('click', () => {
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('theme', state.theme);
  applyTheme();
});

/* ==========================================================
   SEARCH
   ========================================================== */
function openSearch() {
  searchModal.classList.add('show');
  setTimeout(() => searchInput.focus(), 50);
  searchInput.value = '';
  renderSearchResults('');
}

function closeSearch() {
  searchModal.classList.remove('show');
}

searchBtn.addEventListener('click', openSearch);
searchModal.addEventListener('click', (e) => {
  if (e.target === searchModal) closeSearch();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSearch();
  // Ctrl/Cmd + K — открыть поиск
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    openSearch();
  }
});

function renderSearchResults(query) {
  const q = query.trim().toLowerCase();

  const items = Object.values(COURSE)
    .filter(l => l.id !== 'welcome')
    .filter(l => {
      if (!q) return true;
      const inTitle = l.title.toLowerCase().includes(q);
      const inLead = l.lead.toLowerCase().includes(q);
      const inBody = (l.levels.basic + (l.levels.advanced || '')).toLowerCase().includes(q);
      return inTitle || inLead || inBody;
    })
    .slice(0, 20);

  if (items.length === 0) {
    searchResults.innerHTML = '<p class="search-empty">Ничего не найдено</p>';
    return;
  }

  searchResults.innerHTML = items.map(l => `
    <div class="search-result" data-go="${l.id}">
      <div class="search-result__title">${l.num} · ${l.title}</div>
      <div class="search-result__cat">${
        { html:'HTML', css:'CSS', js:'JavaScript', proj:'Проект', ref:'Справочник' }[l.cat] || ''
      }</div>
    </div>
  `).join('');

  searchResults.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      closeSearch();
      render(el.dataset.go);
    });
  });
}

searchInput.addEventListener('input', (e) => {
  renderSearchResults(e.target.value);
});

/* ==========================================================
   INIT
   ========================================================== */
function init() {
  applyTheme();
  updateProgress();

  const hash = location.hash.replace('#', '');
  if (hash && COURSE[hash]) {
    render(hash);
  } else {
    render('welcome');
  }
}

init();
</script>
</body>
</html>
